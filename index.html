<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Esportes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ff3d57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Plantão Esportivo — Quiz</title>
<style>
:root{--ink:#1b1340;--bgA:#ffd23f;--bgB:#ffbe0b;--card:#fffdf4;--tx:#1b1340;--mut:#5a4f8a;--red:#ff3d57;--gt:#138a3f;--rt:#d6103a;--f:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--ol:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink),0 5px 0 var(--ink);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#0d0826;--bgA:#4a2bb5;--bgB:#3b1f98;--card:#2a1d66;--tx:#fff8e1;--mut:#c4baf0;--gt:#4ade80;--rt:#ff7a90}}
:root[data-theme="dark"]{--ink:#0d0826;--bgA:#4a2bb5;--bgB:#3b1f98;--card:#2a1d66;--tx:#fff8e1;--mut:#c4baf0;--gt:#4ade80;--rt:#ff7a90}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bgA) repeating-conic-gradient(from 0deg at 50% 40%,var(--bgA) 0 7deg,var(--bgB) 7deg 14deg);color:var(--tx);font-family:var(--f);font-weight:900;font-synthesis:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--red);border-bottom:5px solid var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.2)}
h1{flex:1;margin:0;font-size:clamp(22px,4vw,44px);letter-spacing:.04em;color:#fff;text-shadow:var(--ol);transform:rotate(-1deg)}
.live{display:flex;align-items:center;gap:7px;padding:4px 12px;background:#fff;color:var(--red);border:3px solid var(--ink);border-radius:999px;font-size:clamp(13px,1.8vw,18px)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:blk 1s infinite}
.sc{padding:3px 18px;background:#ffd23f;color:var(--ink);border:4px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);font-size:clamp(18px,3vw,30px);white-space:nowrap}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 20px 28px;overflow:auto}
section{position:relative;width:100%;max-width:1000px;box-sizing:border-box;padding:clamp(16px,3vw,36px);background:var(--card);border:5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink);text-align:center}
h2{margin:.25em 0;font-size:clamp(32px,6.5vw,76px);line-height:1;color:#ffd23f;text-shadow:var(--ol);transform:rotate(-1.5deg)}
p{margin:.4em 0;color:var(--mut);font-size:clamp(15px,2.2vw,24px)}
.row{display:flex;justify-content:center;gap:clamp(8px,2vw,22px);font-size:clamp(34px,7vw,70px)}
.row span{animation:bob 1.6s ease-in-out infinite}
.row span:nth-child(even){animation-delay:.4s}
.row span:nth-child(3n){animation-delay:.8s}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
#n{margin:0;color:var(--tx);white-space:nowrap;font-size:clamp(14px,2vw,22px)}
#pg{display:flex;flex:1;gap:6px}
#pg i{flex:1;height:16px;background:var(--card);border:3px solid var(--ink);border-radius:999px}
#pg .g{background:#2ed573}
#pg .r{background:#ff4757}
#pg .c{background:#ffd23f;animation:bob 1s infinite}
.qrow{display:flex;align-items:center;gap:20px;margin-bottom:20px}
#mk{flex:none;display:grid;place-items:center;width:clamp(64px,10vw,104px);aspect-ratio:1;font-size:clamp(40px,7vw,68px);background:#fff;border:4px solid var(--ink);border-radius:50%;box-shadow:0 5px 0 var(--ink);animation:bob 1.6s ease-in-out infinite}
#mk.pop{animation:pop .5s}
#q{position:relative;flex:1;margin:0;padding:clamp(12px,2vw,22px);background:#fff4c2;color:#1b1340;text-shadow:none;transform:none;border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);font-size:clamp(20px,3.2vw,36px);line-height:1.2;text-align:left}
#q::before{content:"";position:absolute;left:-18px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--ink);border-left:0}
#o{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
#o button{display:flex;align-items:center;gap:12px;min-height:80px;padding:10px 16px;background:var(--c);color:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);font:inherit;font-size:clamp(18px,2.6vw,28px);line-height:1.15;text-align:left;text-shadow:0 2px 0 rgba(0,0,0,.25);cursor:pointer;transition:transform .08s,box-shadow .08s}
#o button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.o0{--c:#2563eb}.o1{--c:#e11d48}.o2{--c:#16a34a}.o3{--c:#7c3aed}
#o em{flex:none;display:grid;place-items:center;width:1.8em;height:1.8em;font-style:normal;font-size:.85em;background:#fff;color:#1b1340;text-shadow:none;border:3px solid var(--ink);border-radius:50%}
#o b{margin-left:auto;font-size:1.5em}
#o .dim{opacity:.4;filter:grayscale(.6)}
#o .ok{box-shadow:0 0 0 5px #ffd23f,0 0 0 8px var(--ink),0 10px 0 8px var(--ink);animation:pop .5s}
#o .no{animation:shake .45s}
#fb{min-height:1.7em;margin:20px 0 0;font-size:clamp(18px,2.6vw,28px)}
#fb.g{color:var(--gt)}
#fb.r{color:var(--rt)}
.big{margin-top:22px;padding:16px 40px;background:#ffd23f;color:var(--ink);border:5px solid var(--ink);border-radius:999px;box-shadow:0 8px 0 var(--ink);font:inherit;font-size:clamp(22px,3.4vw,38px);letter-spacing:.03em;cursor:pointer;transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
#tr{font-size:clamp(70px,12vw,130px);line-height:1.1;animation:bob 1.4s ease-in-out infinite}
#fsw{line-height:1}
#fs{font-size:clamp(90px,18vw,190px);color:#ffd23f;text-shadow:var(--ol),0 9px 0 var(--ink)}
#fsw span{font-size:clamp(22px,4vw,44px);color:var(--mut)}
#st{margin:.4em 0;font-size:clamp(22px,4vw,38px);letter-spacing:.1em;color:#ff9f1a}
.tk{overflow:hidden;white-space:nowrap;padding:8px 0;background:var(--ink);color:#ffd23f;border-top:5px solid var(--red);font-size:clamp(14px,2vw,20px);letter-spacing:.06em}
.tk span{display:inline-block;padding-left:100%;animation:tick 45s linear infinite}
u{position:fixed;top:-24px;z-index:9;width:12px;height:18px;border:2px solid var(--ink);border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pop{40%{transform:scale(1.25) rotate(-6deg)}70%{transform:scale(.95)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes blk{50%{opacity:.2}}
@keyframes tick{to{transform:translateX(-100%)}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@media (max-width:560px){.qrow{flex-direction:column}#q::before{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#fsb{padding:6px 14px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);font:inherit;font-size:clamp(12px,1.8vw,16px);cursor:pointer}
#fsb:active{transform:translateY(3px);box-shadow:none}
html,body{overscroll-behavior:none}
body{-webkit-touch-callout:none}
</style>
</head>
<body>
<header><b class="live"><i class="dot"></i>AO VIVO</b><h1>PLANTÃO ESPORTIVO</h1><button id="fsb" hidden>TELA CHEIA</button><div class="sc">⭐ <b id="pt">0</b> pts</div></header>
<main>
<section id="home"><div class="row"><span>⚽</span><span>🏀</span><span>🏐</span><span>🎾</span><span>🏎️</span><span>🥊</span><span>🏄</span></div><h2>QUIZ DE ESPORTES</h2><p>10 perguntas · 10 pontos por acerto · máximo de 100</p><button class="big" onclick="start()">BORA JOGAR!</button></section>
<section id="game" hidden><div class="top"><p id="n"></p><div id="pg"></div></div><div class="qrow"><div id="mk">⚽</div><h2 id="q"></h2></div><div id="o"></div><p id="fb"></p></section>
<section id="end" hidden><div id="tr">🏆</div><div id="fsw"><b id="fs">0</b><span> / 100</span></div><div id="st"></div><h2 id="ms"></h2><p id="ac"></p><button class="big" onclick="reset()">NOVO PARTICIPANTE</button></section>
</main>
<div class="tk"><span>⚽ PLANTÃO ESPORTIVO ⚽ QUIZ AO VIVO ⚽ 10 PERGUNTAS ⚽ CADA ACERTO VALE 10 PONTOS ⚽ BOA SORTE, CRAQUE! ⚽</span></div>
<script>
// Formato: [pergunta, resposta certa, errada, errada, errada]
const Q=[
['Quantas Copas do Mundo masculinas a Seleção Brasileira já conquistou?','5','4','6','7'],
['Qual jogador é o único da história a ganhar três Copas do Mundo?','Pelé','Garrincha','Cafu','Ronaldo'],
['Qual seleção foi campeã da Copa do Mundo de 2022, no Catar?','Argentina','França','Croácia','Marrocos'],
['Em qual estádio foi disputada a final da Copa do Mundo de 2014?','Maracanã','Mineirão','Morumbi','Arena Corinthians'],
['Qual craque brasileiro ficou conhecido como “Fenômeno”?','Ronaldo','Romário','Rivaldo','Adriano'],
['Quem é o maior vencedor da Bola de Ouro na história?','Lionel Messi','Cristiano Ronaldo','Michel Platini','Johan Cruyff'],
['Qual país sediou a primeira Copa do Mundo, em 1930?','Uruguai','Brasil','Itália','Argentina'],
['Em qual clube brasileiro o Neymar começou a carreira profissional?','Santos','São Paulo','Flamengo','Corinthians'],
['Quem era o técnico do Brasil na conquista do pentacampeonato, em 2002?','Luiz Felipe Scolari','Carlos Alberto Parreira','Mário Zagallo','Tite'],
['Qual jogadora brasileira foi eleita seis vezes a melhor do mundo pela FIFA?','Marta','Formiga','Cristiane','Debinha'],
['Qual cidade brasileira sediou os Jogos Olímpicos de 2016?','Rio de Janeiro','São Paulo','Brasília','Belo Horizonte'],
['Quantos anéis entrelaçados aparecem na bandeira olímpica?','5','4','6','7'],
['Quem é o atleta com mais medalhas de ouro na história das Olimpíadas?','Michael Phelps','Usain Bolt','Carl Lewis','Mark Spitz'],
['Qual piloto brasileiro foi campeão mundial de Fórmula 1 em 1988, 1990 e 1991?','Ayrton Senna','Nelson Piquet','Emerson Fittipaldi','Rubens Barrichello'],
['Qual equipe italiana de F1, famosa pelos carros vermelhos, é a mais tradicional e vitoriosa da categoria?','Ferrari','McLaren','Mercedes','Red Bull'],
['Quantos jogadores de cada time ficam em quadra no vôlei de quadra?','6','5','7','8'],
['No vôlei, como se chama o jogador especialista em defesa que usa uniforme de cor diferente?','Líbero','Central','Levantador','Ponteiro'],
['Qual astro do basquete, com a camisa 23 do Chicago Bulls, ganhou seis títulos da NBA?','Michael Jordan','LeBron James','Kobe Bryant','Magic Johnson'],
['Qual jogador brasileiro de basquete ficou conhecido como “Mão Santa”?','Oscar Schmidt','Marcelinho Huertas','Leandrinho','Anderson Varejão'],
['Qual tenista brasileiro foi campeão de simples em Roland Garros em 1997, 2000 e 2001?','Gustavo Kuerten (Guga)','Thomaz Bellucci','Fernando Meligeni','Thiago Monteiro'],
['Em qual Grand Slam de tênis os jogadores precisam vestir branco?','Wimbledon','Roland Garros','US Open','Australian Open'],
['Qual nadador brasileiro ganhou o ouro nos 50 m livre em Pequim 2008?','César Cielo','Gustavo Borges','Bruno Fratus','Thiago Pereira'],
['Qual velocista jamaicano ganhou o ouro nos 100 m rasos em 2008, 2012 e 2016?','Usain Bolt','Yohan Blake','Justin Gatlin','Carl Lewis'],
['Qual é a distância oficial de uma maratona?','42,195 km','21,097 km','30 km','50 km'],
['Qual lenda do boxe ficou famosa pela frase “flutua como uma borboleta, ferroa como uma abelha”?','Muhammad Ali','Mike Tyson','Joe Frazier','George Foreman'],
['O UFC é a maior organização de qual esporte?','MMA (artes marciais mistas)','Boxe','Judô','Taekwondo'],
['Qual surfista brasileiro foi campeão mundial em 2014, 2018 e 2021?','Gabriel Medina','Ítalo Ferreira','Filipe Toledo','Adriano de Souza'],
['Qual skatista brasileira, apelidada de “Fadinha”, ganhou medalha olímpica aos 13 anos?','Rayssa Leal','Pâmela Rosa','Letícia Bufoni','Dora Varella'],
['Qual ginasta brasileira ganhou o ouro no solo nos Jogos de Paris 2024?','Rebeca Andrade','Flávia Saraiva','Daiane dos Santos','Jade Barbosa'],
['O Super Bowl é a final de qual esporte?','Futebol americano','Beisebol','Basquete','Hóquei no gelo']
];
const $=id=>document.getElementById(id);
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let R,i=0,p=0,H=[],lock=false;
function show(id){['home','game','end'].forEach(s=>$(s).hidden=s!==id)}
function score(){$('pt').textContent=p}
function dots(){
  const g=$('pg');g.innerHTML='';
  for(let k=0;k<10;k++){const d=document.createElement('i');d.className=k<H.length?(H[k]?'g':'r'):k===i?'c':'';g.append(d)}
}
function start(){R=sh(Q).slice(0,10);i=0;p=0;H=[];score();ask();show('game')}
function ask(){
  lock=false;
  const [q,...o]=R[i];
  $('n').textContent='PERGUNTA '+(i+1)+'/10';
  $('q').textContent=q;
  $('mk').textContent='⚽';$('mk').className='';
  $('fb').textContent='';$('fb').className='';
  dots();
  const box=$('o');box.innerHTML='';
  sh(o.map((t,k)=>[t,k===0])).forEach(([t,c],k)=>{
    const b=document.createElement('button'),e=document.createElement('em'),s=document.createElement('span');
    e.textContent='ABCD'[k];s.textContent=t;
    b.className='o'+k;b.dataset.c=c?'1':'0';b.append(e,s);b.onclick=()=>pick(b,c);box.append(b);
  });
}
function pick(b,c){
  if(lock)return;lock=true;
  document.querySelectorAll('#o button').forEach(x=>{
    const ok=x.dataset.c==='1';
    x.classList.add(ok?'ok':x===b?'no':'dim');
    if(ok||x===b){const m=document.createElement('b');m.textContent=ok?'✓':'✗';x.append(m)}
  });
  H.push(c);dots();
  if(c){p+=10;score();$('mk').textContent='🤩';$('fb').textContent='🎉 Isso aí! +10 pontos';$('fb').className='g'}
  else{$('mk').textContent='😵';$('fb').textContent='😅 Quase! A certa está marcada com ✓';$('fb').className='r'}
  $('mk').className='pop';
  setTimeout(()=>{i++;i<10?ask():fim()},1900);
}
function fim(){
  $('tr').textContent=p>=80?'🏆':p>=50?'🥈':'🥉';
  $('fs').textContent=p;
  $('st').textContent=H.map(h=>h?'★':'☆').join('');
  $('ac').textContent=(p/10)+' de 10 acertos';
  $('ms').textContent=p===100?'GOL DE PLACA! GABARITOU!':p>=80?'CRAQUE DA RODADA!':p>=60?'TITULAR ABSOLUTO!':p>=40?'BOM JOGO!':'FOI PRO BANCO, MAS TEM REVANCHE!';
  show('end');confetti();
}
function confetti(){
  const cs=['#ffd23f','#ff3d57','#2563eb','#16a34a','#7c3aed'];
  for(let k=0;k<14+p/2;k++){
    const u=document.createElement('u');
    u.style.cssText='left:'+(Math.random()*100)+'vw;background:'+cs[k%5]+';animation-delay:'+(Math.random()*.8)+'s;animation-duration:'+(2.2+Math.random()*1.8)+'s';
    document.body.append(u);setTimeout(()=>u.remove(),5200);
  }
}
function reset(){p=0;H=[];score();show('home')}
(function(){
  const d=document.documentElement,rf=d.requestFullscreen||d.webkitRequestFullscreen,b=$('fsb');
  const app=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  if(rf&&!app){b.hidden=false;b.onclick=()=>{try{const r=rf.call(d);if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
